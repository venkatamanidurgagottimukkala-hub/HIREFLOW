<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply - Hireflow</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-5">

                    <h2 class="text-center mb-4">
                        Apply for {{ job.title }}
                    </h2>

                    <p class="text-center text-muted">
                        {{ job.company }} · {{ job.location }}
                    </p>

                    <hr>

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text"
       name="name"
       class="form-control"
       value="{{ user.username }}"
       required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email"
       name="email"
       class="form-control"
       value="{{ user.email }}"
       required>
                        </div>

                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   placeholder="Enter your phone number"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Resume</label>
                            <input type="file"
                                   name="resume"
                                   class="form-control-file">
                        </div>

                        <button type="submit"
                                class="btn btn-primary btn-block">
                            Submit Application
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
